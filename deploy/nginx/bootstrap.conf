# Used only until the Let's Encrypt certificate exists (deploy/setup-ssl.sh).
server {
    listen 80;
    server_name reelaxy.com www.reelaxy.com api.reelaxy.com db.reelaxy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Reelaxy is being set up.\n";
        add_header Content-Type text/plain;
    }
}
