# Reelaxy production routing (HTTPS). One certificate covers all four names.
# Docker's DNS + variables keep nginx running even if an app container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

ssl_certificate     /etc/letsencrypt/live/reelaxy.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/reelaxy.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

client_max_body_size 40m;
proxy_read_timeout 120s;
server_tokens off;

# HTTP: certificate renewals + redirect everything else to HTTPS.
server {
    listen 80;
    server_name reelaxy.com www.reelaxy.com api.reelaxy.com db.reelaxy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.reelaxy.com;
    return 301 https://reelaxy.com$request_uri;
}

# Website (Next.js)
server {
    listen 443 ssl;
    http2 on;
    server_name reelaxy.com;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Deploy status page (static, works even while the website container rebuilds).
    location = /deploy-status {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /usr/share/nginx/status/index.html;
    }
    location = /deploy-status.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /usr/share/nginx/status/deploy.json;
    }

    location / {
        set $frontend http://frontend:3002;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# API + Socket.IO (NestJS)
server {
    listen 443 ssl;
    http2 on;
    server_name api.reelaxy.com;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        set $backend http://backend:5002;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (chat, calls, presence)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# phpMyAdmin, behind an extra password prompt
server {
    listen 443 ssl;
    http2 on;
    server_name db.reelaxy.com;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "Reelaxy database";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        set $pma http://phpmyadmin:80;
        proxy_pass $pma;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
